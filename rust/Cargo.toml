[workspace]
resolver = "2"
members = [
    "crates/split_domain",
    "crates/split_ffi",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Proprietary"
authors = ["Baato Engineering"]

[workspace.dependencies]
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
thiserror = "1.0.64"
uuid = { version = "1.10.0", features = ["v4", "serde"] }
flutter_rust_bridge = "=2.4.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind" # Required so catch_unwind prevents panics crossing FFI
strip = "symbols"