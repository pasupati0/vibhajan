name: Baato Android & Rust FFI CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify-rust-and-flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Generate flutter_rust_bridge Bindings & Run Rust Tests
        working-directory: ./rust
        run: |
          cargo install flutter_rust_bridge_codegen --version 2.4.0 --locked
          mkdir -p ../app/android/app/src/main/jniLibs
          flutter_rust_bridge_codegen generate --config-file crates/split_ffi/flutter_rust_bridge.yaml
          cargo test --workspace

      - name: Build Android Native Libraries via cargo-ndk
        working-directory: ./rust
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t armeabi-v7a \
            -o ../app/android/app/src/main/jniLibs \
            build --release -p split_ffi

      - name: Scaffold Android & Build APK
        working-directory: ./app
        run: |
          flutter create --platforms=android --org in.baato --project-name baato_split .
          flutter pub get
          flutter test
          flutter build apk --release

      - name: Upload Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: baato-split-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk