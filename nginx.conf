server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.frankfurter.dev; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

  # Health endpoint
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # 1. Hashed assets (immutable) - MUST return 404 if missing
  location /assets/ {
    try_files $uri =404; 
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # 2. Never cache index.html so updates are picked up immediately
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # 3. SPA fallback for application routes
  location / {
    try_files $uri $uri/ /index.html;
  }
}