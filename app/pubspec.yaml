name: baato_split
description: India-first offline-capable expense sharing powered by Rust FFI.
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 🔑 The fix: flutter_localizations (Flutter 3.27) pins intl to 0.19.0.
  #    Do NOT use ^0.20.3 — it requires Dart 3.9.0+.
  intl: 0.19.0

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  drift: ^2.20.2
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  flutter_local_notifications: ^17.2.2
  flutter_rust_bridge: 2.4.0
  uuid: ^4.5.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  pdf: ^3.11.1
  csv: ^6.0.0
  cryptography: ^2.7.0
  google_mobile_ads: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.12
  drift_dev: ^2.20.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0
  ffigen: ^13.0.0

flutter:
  uses-material-design: true